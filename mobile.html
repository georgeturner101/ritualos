<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RitualOS Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://georgeturner.space/" />
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Verdana, sans-serif;
      overflow: hidden;
      color: white;
      background: linear-gradient(180deg, #aee3ff 0%, #7fcfff 38%, #8dc8ff 60%, #f6b6d8 100%);
    }

    body {
      position: relative;
    }

    .mobile-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.08) 16%, transparent 30%),
        radial-gradient(circle at 78% 28%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.06) 18%, transparent 32%),
        radial-gradient(ellipse at 50% 115%, rgba(255,190,220,0.45) 0%, rgba(255,190,220,0.22) 28%, transparent 58%),
        linear-gradient(180deg, #aee3ff 0%, #7fcfff 38%, #8dc8ff 60%, #f6b6d8 100%);
    }

    .mobile-bg::before,
    .mobile-bg::after {
      content: "";
      position: absolute;
      inset: -20%;
      filter: blur(30px);
      opacity: 0.7;
      will-change: transform;
    }

    .mobile-bg::before {
      background:
        radial-gradient(circle at 18% 25%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 22%, transparent 36%),
        radial-gradient(circle at 76% 28%, rgba(190,240,255,0.28) 0%, rgba(190,240,255,0.10) 18%, transparent 34%),
        radial-gradient(circle at 56% 78%, rgba(255,190,225,0.30) 0%, rgba(255,190,225,0.10) 20%, transparent 38%);
      animation: bgFloatOne 22s ease-in-out infinite alternate;
    }

    .mobile-bg::after {
      background:
        radial-gradient(circle at 30% 72%, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 20%, transparent 35%),
        radial-gradient(circle at 72% 70%, rgba(255,220,245,0.18) 0%, rgba(255,220,245,0.05) 18%, transparent 34%),
        radial-gradient(circle at 52% 18%, rgba(170,230,255,0.16) 0%, rgba(170,230,255,0.05) 18%, transparent 32%);
      animation: bgFloatTwo 28s ease-in-out infinite alternate;
    }

    @keyframes bgFloatOne {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.02); }
      50% { transform: translate3d(2%, 1.5%, 0) scale(1.05); }
      100% { transform: translate3d(4%, -2%, 0) scale(1.03); }
    }

    @keyframes bgFloatTwo {
      0% { transform: translate3d(1%, 0%, 0) scale(1.04); }
      50% { transform: translate3d(-3%, 2%, 0) scale(1.08); }
      100% { transform: translate3d(2%, -1.5%, 0) scale(1.05); }
    }

    #mobile-warning {
      position: fixed;
      inset: 0;
      background: rgba(20, 50, 110, 0.18);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 24px;
    }

    .enter-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      box-shadow: none;
      border: none;
      padding: 0;
    }

    .enter-panel button {
      border: 1px solid #d468a8;
      background: linear-gradient(to bottom, #ffb7dc, #f28cc2);
      color: white;
      font-weight: bold;
      font-size: 1.1em;
      border-radius: 14px;
      padding: 12px 34px;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0,0,0,0.25);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        0 6px 18px rgba(0,0,0,0.18);
    }

    .enter-panel button:active {
      transform: translateY(1px);
    }

    .app-grid {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px 18px;
      padding: 48px 24px 36px;
      justify-items: center;
      align-content: start;
      box-sizing: border-box;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 120px;
      text-align: center;
      min-height: 110px;
      border-radius: 16px;
      padding: 8px 4px;
    }

    .app-icon:active {
      background: rgba(255,255,255,0.12);
    }

    .app-icon img {
      width: 74px;
      height: 74px;
      margin-bottom: 8px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.22));
      object-fit: contain;
    }

    .app-icon span {
      font-size: 0.92em;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
      line-height: 1.25;
    }

    .mobile-window {
      position: fixed;
      top: 4%;
      left: 4%;
      width: 92%;
      height: 88%;
      background: linear-gradient(145deg, #fff0fc, #ffdff4);
      border: 2px solid #6f99d6;
      border-radius: 14px;
      overflow: hidden;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 12px 30px rgba(0,0,0,0.3);
    }

    .mobile-title-bar {
      background: linear-gradient(to bottom, #5ea2ff, #2f6fd6);
      color: white;
      padding: 10px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1em;
      border-bottom: 1px solid #1d4f9c;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      gap: 10px;
    }

    .mobile-title-bar button {
      width: 28px;
      height: 28px;
      border: 1px solid #8eb5f0;
      border-radius: 6px;
      background: linear-gradient(to bottom, #ff8d8d, #d64a4a);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    .mobile-window-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 0.95em;
      color: #163d72;
      background: linear-gradient(145deg, #fff0fc, #ffdff4);
    }

    .mobile-window-content a {
      color: #0000ee;
      text-decoration: none;
      font-weight: bold;
    }

    .mobile-window-content a:hover {
      color: #551a8b;
      text-decoration: underline;
    }

    .mobile-window-content p {
      line-height: 1.5;
      margin-top: 0;
    }

    #mobile-pdf-viewer {
      display: none;
      position: fixed;
      top: 3%;
      left: 3%;
      width: 94%;
      height: 92%;
      background: linear-gradient(145deg, #fff0fc, #ffdff4);
      border: 2px solid #6f99d6;
      border-radius: 14px;
      z-index: 9999;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 12px 30px rgba(0,0,0,0.35);
    }

    #mobile-pdf-viewer .pdf-topbar {
      background: linear-gradient(to bottom, #5ea2ff, #2f6fd6);
      color: white;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
    }

    #mobile-pdf-viewer .pdf-topbar button {
      width: 26px;
      height: 26px;
      border: 1px solid #8eb5f0;
      border-radius: 6px;
      background: linear-gradient(to bottom, #ff8d8d, #d64a4a);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #mobile-pdf-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: white;
    }

    #mobile-spirit-ghost {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 58px;
      z-index: 80;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      display: none;
      transform: translate3d(40px, 120px, 0);
      filter:
        drop-shadow(0 0 6px rgba(255, 220, 245, 0.95))
        drop-shadow(0 0 16px rgba(180, 230, 255, 0.55));
      will-change: transform;
    }

    .mobile-ghost-trail {
      position: fixed;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      margin-top: -10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 70;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.65) 0%,
        rgba(255,210,240,0.30) 45%,
        rgba(150,220,255,0.10) 70%,
        transparent 100%
      );
      animation: mobileGhostTrailFade 1.2s ease-out forwards;
    }

    @keyframes mobileGhostTrailFade {
      0% {
        opacity: 0.8;
        transform: scale(0.8);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: scale(2.2);
        filter: blur(5px);
      }
    }

    .mobile-ghost-whisper {
      position: fixed;
      z-index: 85;
      pointer-events: none;
      max-width: 180px;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 12px;
      line-height: 1.3;
      color: #24406f;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
      box-shadow:
        0 6px 20px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,0.75);
      animation: mobileWhisperFade 5.5s ease forwards;
    }

    .mobile-ghost-whisper::after {
      content: "";
      position: absolute;
      left: 14px;
      bottom: -8px;
      border-width: 8px 7px 0 7px;
      border-style: solid;
      border-color: rgba(255,255,255,0.88) transparent transparent transparent;
    }

    @keyframes mobileWhisperFade {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      10% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      88% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
    }

    .mobile-link-list a {
      display: block;
      margin: 10px 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.35);
      color: #224a8c;
      text-decoration: none;
      font-weight: bold;
    }

    .mobile-link-list a:active {
      transform: translateY(1px);
    }

    .game-intro {
      margin-bottom: 14px;
      font-size: 0.9em;
      color: #35578e;
    }

    #mobile-birdsweeper-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 10px;
    }

    .mobile-bird-cell {
      aspect-ratio: 1 / 1;
      background: rgba(255, 240, 255, 0.8);
      border: 1px solid #ffb6f4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #3a003a;
      box-shadow: 0 2px 6px rgba(255, 180, 255, 0.2);
      font-size: 0.95em;
      user-select: none;
    }

    .mobile-bird-cell.revealed {
      background: rgba(255,255,255,0.92);
    }

    .mobile-bird-cell.bird {
      background: #ffc6e9;
    }

    .mobile-bird-found {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.52);
      text-align: center;
      display: none;
    }

    .mobile-bird-found img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    #mobile-tuna-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mobile-tuna-grid {
      display: grid;
      grid-template-columns: repeat(14, 18px);
      gap: 2px;
      width: fit-content;
      background: rgba(160, 230, 255, 0.25);
      border: 2px solid rgba(120, 190, 255, 0.7);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 0 18px rgba(170, 240, 255, 0.25);
    }

    .mobile-tuna-cell {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
    }

    .mobile-tuna {
      background: radial-gradient(circle, #ffe2fb 30%, #ff96ec 100%);
      box-shadow: 0 0 6px #ffc7f9, inset 0 0 4px #ffb0f2;
    }

    .mobile-tuna-head {
      background: linear-gradient(135deg, #fff6ff, #fcd3ff);
      border: 1px solid #ffbdf2;
      box-shadow: 0 0 10px #ffa8f2, 0 0 6px #ffdaf7 inset;
    }

    .mobile-tuna-food {
      background: radial-gradient(circle, #fff3b8 10%, #ffcb66 70%);
      border-radius: 50%;
      box-shadow: 0 0 10px #ffe499, 0 0 6px #ffcc33 inset;
      border: 1px solid #fff5d1;
    }

    .mobile-tuna-score {
      font-weight: bold;
      color: #3a4f90;
      font-size: 0.95em;
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .mobile-controls button {
      border: 1px solid #8eb5f0;
      border-radius: 12px;
      background: linear-gradient(to bottom, #f8fbff, #d7e7ff);
      color: #2654a0;
      font-weight: bold;
      font-size: 1.1em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .mobile-controls .empty {
      visibility: hidden;
    }

    .mobile-game-button {
      margin-top: 12px;
      border: 1px solid #d468a8;
      background: linear-gradient(to bottom, #ffb7dc, #f28cc2);
      color: white;
      font-weight: bold;
      border-radius: 12px;
      padding: 10px 14px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
      cursor: pointer;
    }

    .mobile-game-button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    @media (max-width: 380px) {
      .app-grid {
        padding: 42px 18px 28px;
        gap: 20px 12px;
      }

      .app-icon {
        width: 108px;
      }

      .app-icon img {
        width: 68px;
        height: 68px;
      }

      #mobile-tuna-grid {
        grid-template-columns: repeat(14, 16px);
      }

      .mobile-tuna-cell {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>
<body>

<div class="mobile-bg"></div>

<div id="mobile-warning">
  <div class="enter-panel">
    <button onclick="enterMobileSite()">Enter</button>
  </div>
</div>

<div class="app-grid" id="main-site" style="display:none;">
  <div class="app-icon" onclick="openWindow('exhibitions')">
    <img src="icons/folder.png" alt="Exhibitions">
    <span>Exhibitions</span>
  </div>
  <div class="app-icon" onclick="openWindow('freelance')">
    <img src="icons/drive.png" alt="Freelance">
    <span>Freelance</span>
  </div>
  <div class="app-icon" onclick="openWindow('contact')">
    <img src="icons/phone.png" alt="Contact">
    <span>Contact</span>
  </div>
  <div class="app-icon" onclick="openWindow('about')">
    <img src="icons/book.png" alt="About Me">
    <span>About Me</span>
  </div>
  <div class="app-icon" onclick="openWindow('internet')">
    <img src="icons/internet.png" alt="Internet">
    <span>Internet</span>
  </div>
  <div class="app-icon" onclick="openWindow('press')">
    <img src="icons/press.png" alt="Press">
    <span>Press</span>
  </div>
  <div class="app-icon" onclick="openWindow('birdsweeper')">
    <img src="icons/game.png" alt="Birdsweeper">
    <span>Birdsweeper</span>
  </div>
  <div class="app-icon" onclick="openWindow('tuna')">
    <img src="icons/tuna.png" alt="Tuna">
    <span>Tuna</span>
  </div>
</div>

<div id="mobile-windows-container"></div>

<div id="mobile-pdf-viewer">
  <div class="pdf-topbar">
    <span>PDF Viewer</span>
    <button onclick="closeMobilePDF()">X</button>
  </div>
  <iframe id="mobile-pdf-frame" src=""></iframe>
</div>

<img id="mobile-spirit-ghost" src="icons/ghost.png" alt="Spirit ghost">

<script>
function enterMobileSite() {
  document.getElementById('mobile-warning').style.display = 'none';
  document.getElementById('main-site').style.display = 'grid';
}

function openWindow(name) {
  closeAllWindows();
  const container = document.getElementById('mobile-windows-container');
  const win = document.createElement('div');
  win.className = 'mobile-window';
  win.innerHTML = `
    <div class="mobile-title-bar">
      <span>${capitalize(name)}</span>
      <button onclick="closeAllWindows()">X</button>
    </div>
    <div class="mobile-window-content" id="window-content-${name}">Loading...</div>
  `;
  container.appendChild(win);
  loadWindowContent(name);
}

function closeAllWindows() {
  document.getElementById('mobile-windows-container').innerHTML = '';
  stopMobileTunaGame();
}

function capitalize(word) {
  if (word === 'birdsweeper') return 'Birdsweeper';
  return word.charAt(0).toUpperCase() + word.slice(1);
}

const internetLinks = [
  { title: "Heavy Chest, Benee – Sunday926", url: "https://www.youtube.com/watch?v=jxwbtwL-2JM&ab_channel=HEAVYCHEST" },
  { title: "George Turner – Lost at Home", url: "https://www.youtube.com/watch?v=r9GqI2HaAJE&ab_channel=GeorgeTurner(GeorgeTurner)" },
  { title: "George Turner – Love", url: "https://www.youtube.com/watch?v=EMAbum6atCM&ab_channel=GeorgeTurner(GeorgeTurner)" },
  { title: "George Turner – Thank You For Your Time (EP)", url: "https://www.youtube.com/watch?v=MUn0ev3RRWs&ab_channel=GeorgeTurner(GeorgeTurner)" },
  { title: "George Turner – Insect (LP)", url: "https://www.youtube.com/watch?v=g7BoxPGBKE0&ab_channel=GeorgeTurner-Topic" },
  { title: "Exhibition – Free of Charge", url: "https://freeofcharge.space/" },
  { title: "Exhibition – Depot Artspace", url: "https://depot.org.nz/event/towards-equilibrium/" },
  { title: "Exhibition – Bowen Gallery", url: "https://bowengalleries.nz/george-turner-second-impressions/" },
  { title: "Exhibition – Astor Bristed", url: "https://www.astorbristed.co.nz/exhibitions/29-george-turner/" },
  { title: "Exhibition – Webb's", url: "https://auctions.webbs.co.nz/lot-details/index/catalog/718/lot/211832/GEORGE-TURNER-The-River-Bank" }
];

const pressLinks = [
  { title: "Vice – Talking Stage Presence and Art Practice with George Turner", url: "https://www.vice.com/en/article/talking-stage-presence-and-art-practice-with-george-turner/" },
  { title: "Fucking Young – George Turner is Your New Favourite Avant-Pop Artist", url: "https://fuckingyoung.es/george-turner-new-favourite-avant-pop-artist/" },
  { title: "Sniffers – George Turner fuses fine arts with synth pop", url: "https://www.sniffers.co.nz/article/george-turner-fuses-fine-arts-synth-pop-lost-home" },
  { title: "Sniffers – George Turner grounds debut album 'Insect'", url: "https://www.sniffers.co.nz/article/george-turner-grounds-debut-album-insect" },
  { title: "Sniffers – George Turner plants their Roots", url: "https://sniffers.co.nz/article/george-turner-plants-roots-kauri" },
  { title: "Under the Radar – New Single", url: "https://www.undertheradar.co.nz/news/12211/Listen-George-Turner--Age-of-Aquarius.utr" },
  { title: "Massive Magazine – Artist Profile", url: "https://www.massivemagazine.org.nz/articles/ntqehy32wf0jufy44xsvam2bwlv49s" }
];

function loadWindowContent(name) {
  const content = document.getElementById(`window-content-${name}`);
  if (!content) return;

  if (name === 'about') {
    content.innerHTML = `<p>George Turner (Pākehā) is an artist and musician based in Te Whanganui-a-Tara, Aotearoa. Working across a range of digital and physical mediums, Turner’s practice explores queer-ecological narratives and the lingering trauma embedded within Aotearoa’s landscapes. Through large-scale projections, Virtual Reality, Artificial Intelligence, and experimental digital techniques, their work interrogates contemporary identity and the fragile intersections between nature, technology, and belonging.<br><br>
Since 2017, Turner has exhibited extensively across Aotearoa, developing a distinctive voice grounded in queer ecology, environmentalism, and Pākehā identity. Alongside their own practice, they have worked with acclaimed artist Lisa Reihana on major projects including Ihi (Toi Tū Toi Ora: Contemporary Māori Art, 2021) and The Battle (Aotearoa Festival of Arts). In 2022, Turner was selected for the first trans-Tasman digital artist fellowship, co-organised by the Australian Arts Council and Creative New Zealand. Recent highlights include being named a finalist in the 2024 Molly Morpeth Canaday Awards and exhibiting at Bowen Galleries and Webb’s Gallery in Te Whanganui-a-Tara.<br><br>
As a freelance designer and visual artist, Turner has created music videos and visual campaigns for a wide range of musicians including Benee, Heavy Chest, and Lola. They produced visuals for Benee’s 2023 Coachella performance and contributed to the visuals for her international tour. With over a decade of experience, Turner’s music video portfolio spans genres from hip hop and pop to electronica and experimental rock.<br><br>
Also an accomplished musician, Turner has released two EPs (Some Days, Thank You For Your Time) and a full-length debut album, Insect (2019), as well as playing across Aotearoa and Australia. Their sophomore album is scheduled for release in 2025.</p>`;
  } else if (name === 'contact') {
    content.innerHTML = `<p>Email: <a href="mailto:stowaway101@gmail.com">stowaway101@gmail.com</a><br>Instagram: <a href="https://www.instagram.com/georgeturner___/" target="_blank">@georgeturner___</a><br>YouTube: <a href="https://www.youtube.com/@georgeturner8087" target="_blank">@georgeturner8087</a></p>`;
  } else if (name === 'internet') {
    content.innerHTML = `<div class="mobile-link-list">${internetLinks.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.title}</a>`).join('')}</div>`;
  } else if (name === 'press') {
    content.innerHTML = `<div class="mobile-link-list">${pressLinks.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.title}</a>`).join('')}</div>`;
  } else if (name === 'exhibitions') {
    loadPdfList('pdfs/exhibitions/index.json', content);
  } else if (name === 'freelance') {
    loadPdfList('pdfs/freelance/index.json', content);
  } else if (name === 'birdsweeper') {
    renderMobileBirdsweeper(content);
  } else if (name === 'tuna') {
    renderMobileTuna(content);
  }
}

function loadPdfList(jsonPath, container) {
  fetch(jsonPath)
    .then(response => response.json())
    .then(data => {
      container.innerHTML = '';
      data.forEach(name => {
        const link = document.createElement('a');
        link.href = "#";
        link.onclick = (e) => {
          e.preventDefault();
          openMobilePDF(`pdfs/${jsonPath.split('/')[1]}/${name}`);
        };
        link.textContent = name.replace('.pdf', '').replace(/_/g, ' ');
        link.style.display = 'block';
        link.style.margin = '8px 0';
        link.style.padding = '8px 10px';
        link.style.borderRadius = '10px';
        link.style.background = 'rgba(255,255,255,0.35)';
        container.appendChild(link);
      });
    })
    .catch(error => {
      container.innerHTML = '<p>Error loading PDFs.</p>';
      console.error(error);
    });
}

function openMobilePDF(src) {
  window.open(src, '_blank');
}

function closeMobilePDF() {
  const viewer = document.getElementById('mobile-pdf-viewer');
  const frame = document.getElementById('mobile-pdf-frame');
  frame.src = '';
  viewer.style.display = 'none';
}

/* =========================
   MOBILE BIRDSWEEPER
   ========================= */

const mobileBirdFacts = [
  {
    name: 'Kākā',
    img: 'icons/kaka.png',
    fact: 'Intelligent parrot with a hooked beak, often seen in native forests.'
  },
  {
    name: 'Tūī',
    img: 'icons/tui.png',
    fact: 'Known for iridescent feathers and their mimicry-rich song.'
  },
  {
    name: 'Kererū',
    img: 'icons/kereru.png',
    fact: 'Large fruit-eating pigeon vital for forest regeneration.'
  },
  {
    name: 'Kākāpō',
    img: 'icons/kakapo.png',
    fact: 'Critically endangered flightless nocturnal parrot.'
  },
  {
    name: 'Tīeke',
    img: 'icons/tieke.png',
    fact: 'Rare songbird with a chestnut saddle and strong territorial calls.'
  }
];

let mobileBirdGrid = [];
const mobileBirdRows = 8;
const mobileBirdCols = 8;
const mobileBirdCount = 10;

function renderMobileBirdsweeper(container) {
  container.innerHTML = `
    <div class="game-intro">Tap tiles to reveal the forest. Find manu, avoid guesswork, and uncover native birds.</div>
    <div id="mobile-birdsweeper-grid"></div>
    <div class="mobile-game-button-row">
      <button class="mobile-game-button" onclick="initMobileBirdsweeper()">Reset Game</button>
    </div>
    <div class="mobile-bird-found" id="mobile-bird-found">
      <img id="mobile-bird-found-img" src="" alt="">
      <div id="mobile-bird-found-name" style="font-weight:bold; margin-bottom:6px;"></div>
      <div id="mobile-bird-found-fact"></div>
    </div>
  `;
  initMobileBirdsweeper();
}

function initMobileBirdsweeper() {
  const gridEl = document.getElementById('mobile-birdsweeper-grid');
  const foundEl = document.getElementById('mobile-bird-found');
  if (!gridEl) return;

  if (foundEl) foundEl.style.display = 'none';

  mobileBirdGrid = [];
  gridEl.innerHTML = '';

  while (mobileBirdGrid.length < mobileBirdRows * mobileBirdCols) {
    mobileBirdGrid.push({
      isBird: false,
      revealed: false,
      bird: null,
      element: null
    });
  }

  let birdsPlaced = 0;
  while (birdsPlaced < mobileBirdCount) {
    const i = Math.floor(Math.random() * mobileBirdGrid.length);
    if (!mobileBirdGrid[i].isBird) {
      const randomBird = mobileBirdFacts[Math.floor(Math.random() * mobileBirdFacts.length)];
      mobileBirdGrid[i].isBird = true;
      mobileBirdGrid[i].bird = randomBird;
      birdsPlaced++;
    }
  }

  mobileBirdGrid.forEach((cell, i) => {
    const cellDiv = document.createElement('div');
    cellDiv.className = 'mobile-bird-cell';
    cellDiv.dataset.index = i;
    cellDiv.addEventListener('click', () => revealMobileBirdCell(i));
    gridEl.appendChild(cellDiv);
    cell.element = cellDiv;
  });
}

function revealMobileBirdCell(index) {
  const cell = mobileBirdGrid[index];
  if (!cell || cell.revealed) return;

  cell.revealed = true;
  cell.element.classList.add('revealed');

  if (cell.isBird && cell.bird) {
    cell.element.classList.add('bird');
    cell.element.innerHTML = `<img src="${cell.bird.img}" alt="${cell.bird.name}" style="width:100%; height:100%; object-fit:contain; border-radius:6px;" />`;

    document.getElementById('mobile-bird-found-img').src = cell.bird.img;
    document.getElementById('mobile-bird-found-name').textContent = `Species: ${cell.bird.name}`;
    document.getElementById('mobile-bird-found-fact').textContent = cell.bird.fact;
    document.getElementById('mobile-bird-found').style.display = 'block';
    return;
  }

  const count = getAdjacentMobileBirds(index);
  if (count > 0) {
    cell.element.textContent = count;
  } else {
    getMobileBirdNeighbors(index).forEach(neighbor => revealMobileBirdCell(neighbor));
  }
}

function getAdjacentMobileBirds(index) {
  return getMobileBirdNeighbors(index).filter(i => mobileBirdGrid[i].isBird).length;
}

function getMobileBirdNeighbors(index) {
  const neighbors = [];
  const row = Math.floor(index / mobileBirdCols);
  const col = index % mobileBirdCols;

  for (let r = row - 1; r <= row + 1; r++) {
    for (let c = col - 1; c <= col + 1; c++) {
      if (r >= 0 && r < mobileBirdRows && c >= 0 && c < mobileBirdCols && !(r === row && c === col)) {
        neighbors.push(r * mobileBirdCols + c);
      }
    }
  }
  return neighbors;
}

/* =========================
   MOBILE TUNA
   ========================= */

let mobileTunaInterval = null;
let mobileTunaDirection = 1;
let mobileTunaSnake = [];
let mobileTunaFood = null;
let mobileTunaScore = 0;
const mobileTunaGridSize = 14;
const mobileTunaTotalCells = mobileTunaGridSize * mobileTunaGridSize;

function renderMobileTuna(container) {
  container.innerHTML = `
    <div id="mobile-tuna-game">
      <div class="game-intro">Guide the tuna through the glowing tide. Use the arrows below and don't tangle yourself.</div>
      <div class="mobile-tuna-score" id="mobile-tuna-score">Score: 0</div>
      <div id="mobile-tuna-grid"></div>
      <div class="mobile-controls">
        <div class="empty"></div>
        <button onclick="setMobileTunaDirection('up')">↑</button>
        <div class="empty"></div>
        <button onclick="setMobileTunaDirection('left')">←</button>
        <button onclick="setMobileTunaDirection('down')">↓</button>
        <button onclick="setMobileTunaDirection('right')">→</button>
      </div>
      <div class="mobile-game-button-row">
        <button class="mobile-game-button" onclick="initMobileTunaGame()">Restart Tuna</button>
      </div>
    </div>
  `;
  initMobileTunaGame();
}

function initMobileTunaGame() {
  stopMobileTunaGame();

  const grid = document.getElementById('mobile-tuna-grid');
  const scoreEl = document.getElementById('mobile-tuna-score');
  if (!grid || !scoreEl) return;

  grid.innerHTML = '';
  for (let i = 0; i < mobileTunaTotalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'mobile-tuna-cell';
    grid.appendChild(cell);
  }

  mobileTunaSnake = [44, 45, 46];
  mobileTunaDirection = 1;
  mobileTunaScore = 0;
  scoreEl.textContent = 'Score: 0';

  spawnMobileTunaFood();
  drawMobileTuna();

  mobileTunaInterval = setInterval(moveMobileTuna, 220);
}

function getMobileTunaCells() {
  return Array.from(document.querySelectorAll('#mobile-tuna-grid .mobile-tuna-cell'));
}

function drawMobileTuna() {
  const cells = getMobileTunaCells();
  if (!cells.length) return;

  cells.forEach(cell => {
    cell.className = 'mobile-tuna-cell';
  });

  mobileTunaSnake.forEach((index, i) => {
    if (!cells[index]) return;
    cells[index].classList.add('mobile-tuna');
    if (i === mobileTunaSnake.length - 1) {
      cells[index].classList.add('mobile-tuna-head');
    }
  });

  if (cells[mobileTunaFood]) {
    cells[mobileTunaFood].classList.add('mobile-tuna-food');
  }
}

function spawnMobileTunaFood() {
  do {
    mobileTunaFood = Math.floor(Math.random() * mobileTunaTotalCells);
  } while (mobileTunaSnake.includes(mobileTunaFood));
}

function moveMobileTuna() {
  const head = mobileTunaSnake[mobileTunaSnake.length - 1];
  const next = head + mobileTunaDirection;

  const hitWall =
    next < 0 ||
    next >= mobileTunaTotalCells ||
    (mobileTunaDirection === 1 && head % mobileTunaGridSize === mobileTunaGridSize - 1) ||
    (mobileTunaDirection === -1 && head % mobileTunaGridSize === 0) ||
    mobileTunaSnake.includes(next);

  if (hitWall) {
    stopMobileTunaGame();
    const scoreEl = document.getElementById('mobile-tuna-score');
    if (scoreEl) scoreEl.textContent = `Game Over — Score: ${mobileTunaScore}`;
    return;
  }

  mobileTunaSnake.push(next);

  if (next === mobileTunaFood) {
    mobileTunaScore++;
    const scoreEl = document.getElementById('mobile-tuna-score');
    if (scoreEl) scoreEl.textContent = `Score: ${mobileTunaScore}`;
    spawnMobileTunaFood();
  } else {
    mobileTunaSnake.shift();
  }

  drawMobileTuna();
}

function setMobileTunaDirection(direction) {
  if (direction === 'up' && mobileTunaDirection !== mobileTunaGridSize) mobileTunaDirection = -mobileTunaGridSize;
  if (direction === 'down' && mobileTunaDirection !== -mobileTunaGridSize) mobileTunaDirection = mobileTunaGridSize;
  if (direction === 'left' && mobileTunaDirection !== 1) mobileTunaDirection = -1;
  if (direction === 'right' && mobileTunaDirection !== -1) mobileTunaDirection = 1;
}

function stopMobileTunaGame() {
  if (mobileTunaInterval) {
    clearInterval(mobileTunaInterval);
    mobileTunaInterval = null;
  }
}

/* =========================
   MOBILE GHOST
   gently drifts, avoids taps,
   desktop blink timing
   ========================= */

let mobileGhostStarted = false;
let mobileGhostEl = null;

let mgX = 40;
let mgY = 120;
let mgTargetX = 40;
let mgTargetY = 120;

let mgIdle = false;
let mgSleeping = false;
let mgIdleTimer = null;
let mgBlinkTimer = null;
let mgWhisperTimer = null;
let mgWanderTimer = null;
let mgDriftTimer = null;

const MOBILE_GHOST_SPRITES = {
  base: 'icons/ghost.png',
  blink: 'icons/ghost-blink.png',
  sleep: 'icons/ghost-sleep.png'
};

const mobileGhostWhispers = [
  "The forest remembers you.",
  "There is light between the moss.",
  "Softness is resistance.",
  "Time does not pass here.",
  "Stay. Drift.",
  "The rain was listening."
];


const originalEnterMobileSite = enterMobileSite;
enterMobileSite = function () {
  originalEnterMobileSite();
  initMobileGhost();
};

function initMobileGhost() {
  if (mobileGhostStarted) return;

  mobileGhostEl = document.getElementById('mobile-spirit-ghost');
  if (!mobileGhostEl) return;

  mobileGhostStarted = true;
  mobileGhostEl.style.display = 'block';
  mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;

  mgX = window.innerWidth * 0.25;
  mgY = window.innerHeight * 0.28;
  mgTargetX = mgX;
  mgTargetY = mgY;

  animateMobileGhost();
  blinkMobileGhost();
  resetMobileGhostIdleTimer();
  startMobileGhostWhispers();
  startMobileGhostDrift();

  document.addEventListener('pointerdown', repelGhostFromPoint, { passive: true });
  document.addEventListener('touchstart', handleGhostTouchStart, { passive: true });

  window.addEventListener('resize', () => {
    mgTargetX = clamp(mgTargetX, 8, window.innerWidth - 70);
    mgTargetY = clamp(mgTargetY, 8, window.innerHeight - 90);
    mgX = clamp(mgX, 8, window.innerWidth - 70);
    mgY = clamp(mgY, 8, window.innerHeight - 90);
  });
}

function animateMobileGhost() {
  mgX += (mgTargetX - mgX) * 0.035;
  mgY += (mgTargetY - mgY) * 0.035;

  if (mobileGhostEl) {
    mobileGhostEl.style.transform = `translate3d(${mgX}px, ${mgY}px, 0)`;
    leaveMobileGhostTrail();
  }

  requestAnimationFrame(animateMobileGhost);
}

function leaveMobileGhostTrail() {
  if (Math.random() > 0.18) return;

  const trail = document.createElement('div');
  trail.className = 'mobile-ghost-trail';
  trail.style.left = `${mgX + 20}px`;
  trail.style.top = `${mgY + 20}px`;
  document.body.appendChild(trail);

  setTimeout(() => {
    trail.remove();
  }, 1200);
}


function blinkMobileGhost() {
  if (mgSleeping || !mobileGhostEl) return;

  mobileGhostEl.src = MOBILE_GHOST_SPRITES.blink;

  setTimeout(() => {
    if (!mgSleeping && mobileGhostEl) {
      mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;
    }
  }, 200);

  mgBlinkTimer = setTimeout(blinkMobileGhost, 400 + Math.random() * 500);
}


function startMobileGhostDrift() {
  clearTimeout(mgDriftTimer);

  function driftLoop() {
    if (!mobileGhostStarted || mgSleeping) return;

    const padding = 20;
    const maxX = Math.max(padding, window.innerWidth - 90);
    const maxY = Math.max(100, window.innerHeight - 130);

    const driftAmountX = 40 + Math.random() * 90;
    const driftAmountY = 30 + Math.random() * 70;
    const dirX = Math.random() > 0.5 ? 1 : -1;
    const dirY = Math.random() > 0.5 ? 1 : -1;

    mgTargetX = clamp(mgX + driftAmountX * dirX, padding, maxX);
    mgTargetY = clamp(mgY + driftAmountY * dirY, 30, maxY);

    mgDriftTimer = setTimeout(driftLoop, 2500 + Math.random() * 2500);
  }

  driftLoop();
}


function handleGhostTouchStart(e) {
  const touch = e.touches && e.touches[0];
  if (!touch) return;
  moveGhostAwayFromPoint(touch.clientX, touch.clientY);
}

function repelGhostFromPoint(e) {
  moveGhostAwayFromPoint(e.clientX, e.clientY);
}

function moveGhostAwayFromPoint(x, y) {
  if (!mobileGhostStarted) return;

  const ghostCenterX = mgX + 29;
  const ghostCenterY = mgY + 29;

  let dx = ghostCenterX - x;
  let dy = ghostCenterY - y;

  const dist = Math.sqrt(dx * dx + dy * dy) || 1;

  dx /= dist;
  dy /= dist;

  const repelDistance = 120;

  mgTargetX = clamp(mgX + dx * repelDistance, 8, window.innerWidth - 70);
  mgTargetY = clamp(mgY + dy * repelDistance, 8, window.innerHeight - 90);

  wakeMobileGhost();
  resetMobileGhostIdleTimer();

  if (Math.random() > 0.65) {
    showMobileGhostWhisper();
  }
}


function resetMobileGhostIdleTimer() {
  clearTimeout(mgIdleTimer);
  mgIdleTimer = setTimeout(triggerMobileGhostSleep, 40000);
}

function triggerMobileGhostSleep() {
  mgIdle = true;
  mgSleeping = true;

  if (mobileGhostEl) {
    mobileGhostEl.src = MOBILE_GHOST_SPRITES.sleep;
  }

  clearTimeout(mgDriftTimer);
  mobileGhostSleepWander();
}

function mobileGhostSleepWander() {
  if (!mgIdle || !mgSleeping) return;

  mgTargetX = Math.random() * Math.max(60, window.innerWidth - 90) + 10;
  mgTargetY = Math.random() * Math.max(120, window.innerHeight - 150) + 20;

  mgWanderTimer = setTimeout(mobileGhostSleepWander, 5000);
}

function wakeMobileGhost() {
  mgIdle = false;

  if (mgSleeping) {
    mgSleeping = false;
    clearTimeout(mgWanderTimer);

    if (mobileGhostEl) {
      mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;
    }

    clearTimeout(mgBlinkTimer);
    blinkMobileGhost();
    startMobileGhostDrift();
  }
}

function showMobileGhostWhisper() {
  if (!mobileGhostEl) return;

  const whisper = document.createElement('div');
  whisper.className = 'mobile-ghost-whisper';
  whisper.textContent = mobileGhostWhispers[Math.floor(Math.random() * mobileGhostWhispers.length)];

  whisper.style.left = `${clamp(mgX + 20, 10, window.innerWidth - 190)}px`;
  whisper.style.top = `${clamp(mgY - 18, 10, window.innerHeight - 100)}px`;

  document.body.appendChild(whisper);

  setTimeout(() => {
    whisper.remove();
  }, 5500);
}

function startMobileGhostWhispers() {
  clearTimeout(mgWhisperTimer);

  function queueWhisper() {
    const delay = 30000 + Math.random() * 30000;
    mgWhisperTimer = setTimeout(() => {
      if (mobileGhostStarted) {
        showMobileGhostWhisper();
      }
      queueWhisper();
    }, delay);
  }

  queueWhisper();
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

</script>
