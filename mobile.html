<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RitualOS Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://georgeturner.space/" />

  <!-- Shared with the desktop site — same --aero-*/--xp-blue-*/--text-navy
       tokens and gel-material recipes, so mobile can't drift from the main
       site's look again the way the old hand-copied :root here did. Most
       of these files' selectors (.window, #start-menu, .gtpaint-*, etc.)
       simply don't match anything in this page's DOM. -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="aero.css" />

  <style>
    :root {
      /* mobile-only decorative background — a slow-drifting night sky,
         its own family (not chrome) — deep indigo up top through to a
         soft violet horizon glow, same aurora mint/violet family as the
         desktop's own night sky (aero.css's --aero-aurora-*) — plus a
         couple of bird/tuna cell tints not exposed as shared tokens */
      --night-sky-1: #050b1a;
      --night-sky-2: #0d1830;
      --night-sky-3: #1c2c58;
      --night-horizon: #3a2f6b;

      --bird-cell-border: #f0a9d9;
      --bird-cell-fill: #ffcbe9;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Verdana, sans-serif;
      overflow: hidden;
      color: white;
      background: linear-gradient(180deg, var(--night-sky-1) 0%, var(--night-sky-2) 45%, var(--night-sky-3) 75%, var(--night-horizon) 100%);
    }

    body {
      position: relative;
    }

    .mobile-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(180deg, var(--night-sky-1) 0%, var(--night-sky-2) 45%, var(--night-sky-3) 75%, var(--night-horizon) 100%);
    }

    /* soft ambient colour blobs — same slow drift as before, just
       recoloured from day's white/pink highlights to cool aurora glimmers */
    .mobile-bg::before,
    .mobile-bg::after {
      content: "";
      position: absolute;
      inset: -20%;
      filter: blur(30px);
      opacity: 0.55;
      will-change: transform;
    }

    .mobile-bg::before {
      background:
        radial-gradient(circle at 18% 25%, rgba(150,220,255,0.14) 0%, rgba(150,220,255,0.04) 22%, transparent 36%),
        radial-gradient(circle at 76% 60%, rgba(150,255,210,0.10) 0%, rgba(150,255,210,0.03) 18%, transparent 34%),
        radial-gradient(circle at 56% 85%, rgba(200,160,255,0.16) 0%, rgba(200,160,255,0.05) 20%, transparent 38%);
      animation: bgFloatOne 22s ease-in-out infinite alternate;
    }

    .mobile-bg::after {
      background:
        radial-gradient(circle at 30% 72%, rgba(180,200,255,0.10) 0%, rgba(180,200,255,0.03) 20%, transparent 35%),
        radial-gradient(circle at 72% 30%, rgba(210,170,255,0.10) 0%, rgba(210,170,255,0.03) 18%, transparent 34%),
        radial-gradient(circle at 52% 18%, rgba(140,200,255,0.10) 0%, rgba(140,200,255,0.03) 18%, transparent 32%);
      animation: bgFloatTwo 28s ease-in-out infinite alternate;
    }

    @keyframes bgFloatOne {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.02); }
      50% { transform: translate3d(2%, 1.5%, 0) scale(1.05); }
      100% { transform: translate3d(4%, -2%, 0) scale(1.03); }
    }

    @keyframes bgFloatTwo {
      0% { transform: translate3d(1%, 0%, 0) scale(1.04); }
      50% { transform: translate3d(-3%, 2%, 0) scale(1.08); }
      100% { transform: translate3d(2%, -1.5%, 0) scale(1.05); }
    }

    /* stars — a fixed dot field that drifts almost imperceptibly (a
       120s traversal) with a slow, gentle twinkle so it reads as a living
       sky rather than a static image */
    .mobile-stars {
      position: absolute;
      inset: -15%;
      background-repeat: no-repeat;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 12%, white, transparent),
        radial-gradient(1px 1px at 18% 22%, white, transparent),
        radial-gradient(2px 2px at 28% 8%, white, transparent),
        radial-gradient(1px 1px at 36% 30%, white, transparent),
        radial-gradient(1.5px 1.5px at 46% 15%, white, transparent),
        radial-gradient(1px 1px at 54% 26%, white, transparent),
        radial-gradient(2px 2px at 62% 10%, white, transparent),
        radial-gradient(1px 1px at 70% 34%, white, transparent),
        radial-gradient(1.5px 1.5px at 78% 18%, white, transparent),
        radial-gradient(1px 1px at 86% 28%, white, transparent),
        radial-gradient(2px 2px at 92% 12%, white, transparent),
        radial-gradient(1.5px 1.5px at 14% 42%, white, transparent),
        radial-gradient(1px 1px at 24% 50%, white, transparent),
        radial-gradient(1.5px 1.5px at 34% 46%, white, transparent),
        radial-gradient(1px 1px at 44% 55%, white, transparent),
        radial-gradient(2px 2px at 52% 44%, white, transparent),
        radial-gradient(1px 1px at 60% 52%, white, transparent),
        radial-gradient(1.5px 1.5px at 68% 47%, white, transparent),
        radial-gradient(1px 1px at 76% 58%, white, transparent),
        radial-gradient(1.5px 1.5px at 84% 44%, white, transparent),
        radial-gradient(1px 1px at 91% 53%, white, transparent),
        radial-gradient(1.5px 1.5px at 6% 65%, white, transparent),
        radial-gradient(1px 1px at 20% 68%, white, transparent),
        radial-gradient(1.5px 1.5px at 40% 66%, white, transparent),
        radial-gradient(1px 1px at 64% 66%, white, transparent),
        radial-gradient(1.5px 1.5px at 88% 68%, white, transparent);
      animation: mobileStarsDrift 120s ease-in-out infinite alternate, mobileStarsTwinkle 6s ease-in-out infinite alternate;
    }

    @keyframes mobileStarsDrift {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-2.5%, 1.5%, 0); }
    }

    @keyframes mobileStarsTwinkle {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }

    /* a faint aurora ribbon, same recipe/spirit as the desktop night
       sky's aurora — mint-to-violet, blurred, drifting very slowly */
    .mobile-aurora {
      position: absolute;
      top: -12%;
      left: -15%;
      right: -15%;
      height: 45%;
      background: linear-gradient(100deg, transparent 0%, rgba(140,255,210,0.12) 25%, transparent 45%, rgba(190,150,255,0.14) 65%, transparent 90%);
      filter: blur(36px);
      opacity: 0.6;
      animation: mobileAuroraDrift 46s ease-in-out infinite alternate;
    }

    @keyframes mobileAuroraDrift {
      0% { transform: translateX(-3%) translateY(0); }
      100% { transform: translateX(3%) translateY(-2%); }
    }

    .mobile-moon {
      position: absolute;
      top: 3%;
      right: 7%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 32%, #fffef4 0%, #fdf6d8 45%, #e7dcac 100%);
      box-shadow:
        0 0 26px 8px rgba(255,250,220,0.32),
        0 0 60px 22px rgba(255,250,220,0.12);
      animation: mobileMoonDrift 60s ease-in-out infinite alternate;
    }

    @keyframes mobileMoonDrift {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-4%, 2%, 0); }
    }

 #mobile-warning {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,255,255,0.035) 0%, transparent 30%),
    linear-gradient(180deg, #050505 0%, #0a0a0a 45%, #030303 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 24px;
}

.enter-panel {
  position: relative;
  z-index: 2;
  width: min(320px, 82vw);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  text-align: center;
  background: transparent;
  box-shadow: none;
  border: none;
  padding: 0;
}

.mobile-enter-logo {
  width: min(220px, 62vw);
  max-width: 220px;
  height: auto;
  display: block;
  filter:
    drop-shadow(0 0 8px rgba(255,255,255,0.12))
    drop-shadow(0 0 20px rgba(210,210,210,0.08));
  animation: mobileEnterLogoFloat 4s ease-in-out infinite;
}

.mobile-enter-subtitle {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.28em;
  color: #bfbfbf;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(255,255,255,0.06);
}

.enter-panel button {
  min-width: 160px;
  height: 44px;
  padding: 0 26px;
  border: 1px solid rgba(205, 205, 205, 0.7);
  border-radius: 0;
  background:
    linear-gradient(180deg, rgba(30,30,30,0.95) 0%, rgba(10,10,10,0.98) 100%);
  color: #d6d6d6;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  cursor: pointer;
  text-shadow: 0 0 8px rgba(255,255,255,0.08);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.06),
    0 0 12px rgba(255,255,255,0.03);
  transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}

.enter-panel button:hover {
  background:
    linear-gradient(180deg, rgba(40,40,40,0.96) 0%, rgba(14,14,14,0.99) 100%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,0.08),
    0 0 16px rgba(255,255,255,0.05);
}

.enter-panel button:active {
  transform: translateY(1px);
}

@keyframes mobileEnterLogoFloat {
  0%, 100% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-3px);
  }
}

    .app-grid {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px 18px;
      padding: 48px 24px 36px;
      justify-items: center;
      align-content: start;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      width: 120px;
      text-align: center;
      min-height: 110px;
      border-radius: 16px;
      padding: 8px 4px;
    }

    .app-icon:active {
      background: rgba(255,255,255,0.12);
    }

    .app-icon img {
      width: 74px;
      height: 74px;
      margin-bottom: 8px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.22));
      object-fit: contain;
    }

    .app-icon span {
      font-size: 0.92em;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
      line-height: 1.25;
    }

    .mobile-window {
      position: fixed;
      top: 4%;
      left: 4%;
      width: 92%;
      height: 88%;
      background: linear-gradient(
        160deg,
        color-mix(in srgb, transparent 8%, var(--aero-aqua)) 0%,
        color-mix(in srgb, transparent 18%, var(--xp-blue-light)) 45%,
        color-mix(in srgb, transparent 28%, var(--xp-blue-dark)) 100%
      );
      backdrop-filter: blur(16px);
      border: 1.5px solid color-mix(in srgb, white 65%, var(--aero-aqua));
      border-radius: 18px;
      overflow: hidden;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.5),
        0 0 26px color-mix(in srgb, var(--aero-aqua) 40%, transparent),
        0 12px 30px rgba(0,10,25,0.4);
    }

    .mobile-title-bar {
      min-height: 34px;
      box-sizing: border-box;
      background: linear-gradient(160deg, color-mix(in srgb, white 30%, var(--aero-aqua)) 0%, var(--aero-aqua) 55%, color-mix(in srgb, var(--aero-aqua) 60%, var(--xp-blue-dark)) 100%);
      color: white;
      padding: 10px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1em;
      text-shadow: 0 1px 1px rgba(0,0,0,0.35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
      gap: 10px;
    }

    /* Close button keeps a larger touch target than desktop's 22px —
       intentional, for mobile tap ergonomics — same red gel-orb recipe
       as the desktop exit orbs, just round and a little bigger */
    .mobile-title-bar button {
      width: 30px;
      height: 30px;
      border: 1.5px solid rgba(255,255,255,0.65);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, var(--danger-red-hover-light), var(--danger-red-light) 45%, var(--danger-red-dark) 100%);
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 2px 6px rgba(0,10,25,0.3);
      flex-shrink: 0;
    }

    .mobile-window-content {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-size: 0.95em;
      color: var(--text-navy);
      background: linear-gradient(
        160deg,
        rgba(255,255,255,0.95) 0%,
        color-mix(in srgb, white 60%, var(--xp-blue-light)) 55%,
        color-mix(in srgb, white 38%, var(--xp-blue-light)) 100%
      );
    }

    .mobile-window-content a {
      color: var(--text-navy);
      text-decoration: none;
      font-weight: bold;
    }

    .mobile-window-content a:hover {
      color: color-mix(in srgb, var(--text-navy) 70%, var(--xp-blue-mid));
      text-decoration: underline;
    }

    .mobile-window-content p {
      line-height: 1.5;
      margin-top: 0;
    }

    #mobile-spirit-ghost {
      position: fixed;
      top: 0;
      left: 0;
      width: 58px;
      height: 58px;
      z-index: 80;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      display: none;
      transform: translate3d(40px, 120px, 0);
      filter:
        drop-shadow(0 0 6px rgba(255, 220, 245, 0.95))
        drop-shadow(0 0 16px rgba(180, 230, 255, 0.55));
      will-change: transform;
    }

    .mobile-ghost-trail {
      position: fixed;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      margin-top: -10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 70;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.65) 0%,
        rgba(255,204,255,0.30) 45%,
        rgba(192,234,255,0.10) 70%,
        transparent 100%
      );
      animation: mobileGhostTrailFade 1.2s ease-out forwards;
    }

    @keyframes mobileGhostTrailFade {
      0% {
        opacity: 0.8;
        transform: scale(0.8);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: scale(2.2);
        filter: blur(5px);
      }
    }

    .mobile-ghost-whisper {
      position: fixed;
      z-index: 85;
      pointer-events: none;
      max-width: 180px;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 12px;
      line-height: 1.3;
      color: var(--text-navy);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
      box-shadow:
        0 6px 20px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,0.75);
      animation: mobileWhisperFade 5.5s ease forwards;
    }

    .mobile-ghost-whisper::after {
      content: "";
      position: absolute;
      left: 14px;
      bottom: -8px;
      border-width: 8px 7px 0 7px;
      border-style: solid;
      border-color: rgba(255,255,255,0.88) transparent transparent transparent;
    }

    @keyframes mobileWhisperFade {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      10% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      88% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
    }

    .mobile-link-list a {
      position: relative;
      display: block;
      margin: 8px 0;
      padding: 11px 14px;
      border-radius: 999px;
      background: linear-gradient(
        160deg,
        rgba(255,255,255,0.97) 0%,
        color-mix(in srgb, white 62%, var(--xp-blue-light)) 55%,
        color-mix(in srgb, white 35%, var(--xp-blue-light)) 100%
      );
      border: 1.5px solid rgba(255,255,255,0.75);
      box-shadow:
        inset 0 -3px 6px color-mix(in srgb, var(--xp-blue-mid) 25%, transparent),
        inset 0 2px 0 rgba(255,255,255,0.85),
        0 4px 12px color-mix(in srgb, var(--aero-aqua) 30%, transparent);
      color: var(--text-navy);
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.12s ease;
    }

    .mobile-link-list a:active {
      transform: translateY(1px) scale(0.985);
    }

    .mobile-link-list a.now-playing {
      background: linear-gradient(160deg, rgba(255,255,255,0.98) 0%, color-mix(in srgb, white 35%, var(--start-green-light)) 100%);
      color: var(--start-green-dark);
    }

    .game-intro {
      margin-bottom: 14px;
      font-size: 0.9em;
      color: var(--text-navy);
    }

    .mobile-paint-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mobile-paint-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.65);
      box-shadow: 0 2px 6px rgba(0,10,25,0.25);
      padding: 0;
      cursor: pointer;
    }

    .mobile-paint-swatch.active {
      border-color: var(--aero-aqua);
      box-shadow: 0 0 0 2px color-mix(in srgb, white 40%, var(--aero-aqua)), 0 2px 6px rgba(0,10,25,0.25);
    }

    .mobile-paint-canvas {
      display: block;
      width: 100%;
      border-radius: 12px;
      border: 1.5px solid color-mix(in srgb, white 55%, var(--aero-aqua));
      box-shadow: inset 0 2px 6px rgba(0,20,40,0.15);
      touch-action: none;
      background: #ffffff;
    }

    #mobile-birdsweeper-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 10px;
    }

    .mobile-bird-cell {
      aspect-ratio: 1 / 1;
      background: rgba(255, 240, 255, 0.8);
      border: 1px solid var(--bird-cell-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-plum);
      box-shadow: 0 2px 6px rgba(255, 180, 255, 0.2);
      font-size: 0.95em;
      user-select: none;
    }

    .mobile-bird-cell.revealed {
      background: rgba(255,255,255,0.92);
    }

    .mobile-bird-cell.bird {
      background: var(--bird-cell-fill);
    }

    .mobile-bird-found {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.52);
      text-align: center;
      display: none;
    }

    .mobile-bird-found img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    #mobile-tuna-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mobile-tuna-grid {
      display: grid;
      grid-template-columns: repeat(14, 18px);
      gap: 2px;
      width: fit-content;
      background: rgba(160, 230, 255, 0.25);
      border: 2px solid rgba(120, 190, 255, 0.7);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 0 18px rgba(170, 240, 255, 0.25);
    }

    .mobile-tuna-cell {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
    }

    .mobile-tuna {
      background: radial-gradient(circle, var(--tuna-pink-light) 30%, var(--tuna-pink-dark) 100%);
      box-shadow: 0 0 6px var(--tuna-glow-a), inset 0 0 4px var(--tuna-glow-b);
    }

    .mobile-tuna-head {
      background: linear-gradient(135deg, var(--tuna-head-light), var(--tuna-head-dark));
      border: 1px solid var(--tuna-head-border);
      box-shadow: 0 0 10px var(--tuna-head-glow-a), 0 0 6px var(--tuna-head-glow-b) inset;
    }

    .mobile-tuna-food {
      background: radial-gradient(circle, var(--gold-light) 10%, var(--gold-mid) 70%);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold-glow), 0 0 6px var(--gold-dark) inset;
      border: 1px solid var(--gold-pale);
    }

    .mobile-tuna-score {
      font-weight: bold;
      color: var(--text-navy);
      font-size: 0.95em;
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .mobile-controls button {
      border: 1.5px solid color-mix(in srgb, white 55%, var(--aero-aqua));
      border-radius: 12px;
      background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.55), color-mix(in srgb, transparent 40%, var(--aero-aqua)) 55%, color-mix(in srgb, transparent 62%, var(--xp-blue-dark)) 100%);
      color: white;
      font-weight: bold;
      font-size: 1.1em;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.35), 0 0 10px var(--aero-glow-aqua);
    }

    .mobile-controls .empty {
      visibility: hidden;
    }

    .mobile-game-button {
      margin-top: 12px;
      border: 1px solid var(--tuna-button-border);
      background: linear-gradient(to bottom, var(--tuna-button-light), var(--tuna-button-dark));
      color: white;
      font-weight: bold;
      border-radius: 12px;
      padding: 10px 14px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.2);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
      cursor: pointer;
    }

/* =========================
   MOBILE MUSIC
   simplified Jukebox: no visualizer/seek chrome, just a track list that
   plays through a single shared <audio> element, tap-to-toggle
   ========================= */

let mobileAudio = null;
let mobileMusicTracks = [];
let mobileNowPlayingIndex = -1;

function renderMobileMusic(container) {
  container.innerHTML = `
    <div class="game-intro">Tap a track to play. Tap the playing track again to pause.</div>
    <div class="mobile-link-list" id="mobile-track-list">Loading tracks…</div>
  `;

  fetch('music/tracks.json')
    .then(res => res.json())
    .then(tracks => {
      mobileMusicTracks = tracks;
      const list = document.getElementById('mobile-track-list');
      if (!list) return;

      list.innerHTML = '';
      tracks.forEach((track, i) => {
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = track.title;
        a.dataset.index = i;
        a.onclick = (e) => {
          e.preventDefault();
          toggleMobileTrack(i);
        };
        list.appendChild(a);
      });

      updateMobileNowPlayingUI(mobileNowPlayingIndex);
    })
    .catch(() => {
      const list = document.getElementById('mobile-track-list');
      if (list) list.innerHTML = '<p>Error loading tracks.</p>';
    });
}

function getMobileAudio() {
  if (!mobileAudio) {
    mobileAudio = new Audio();
    mobileAudio.addEventListener('ended', () => {
      mobileNowPlayingIndex = -1;
      updateMobileNowPlayingUI(-1);
    });
  }
  return mobileAudio;
}

function toggleMobileTrack(index) {
  const audio = getMobileAudio();
  const track = mobileMusicTracks[index];
  if (!track) return;

  if (mobileNowPlayingIndex === index && !audio.paused) {
    audio.pause();
    mobileNowPlayingIndex = -1;
    updateMobileNowPlayingUI(-1);
    return;
  }

  audio.src = 'music/tracks/' + encodeURIComponent(track.file);
  audio.play().catch(() => {});
  mobileNowPlayingIndex = index;
  updateMobileNowPlayingUI(index);
}

function updateMobileNowPlayingUI(index) {
  const list = document.getElementById('mobile-track-list');
  if (!list) return;
  Array.from(list.children).forEach(a => {
    a.classList.toggle('now-playing', Number(a.dataset.index) === index);
  });
}

function stopMobileMusic() {
  if (mobileAudio) mobileAudio.pause();
  mobileNowPlayingIndex = -1;
}

/* =========================
   MOBILE VIDEO
   simplified Video Player: a list of clips that load into one native
   <video> element with its own controls, instead of desktop's custom
   screen/fader/seek device chrome (native controls are the better fit
   for a touch screen anyway)
   ========================= */

let mobileVideoActiveIndex = -1;

function renderMobileVideo(container) {

  // Clear the now-playing highlight once a video finishes on its own —

  if (player) {
    player.addEventListener('ended', () => {
      mobileVideoActiveIndex = -1;
      const list = document.getElementById('mobile-video-list');

   MOBILE BIRDSWEEPER
   ========================= */

const mobileBirdFacts = [
  {
    name: 'Kākā',
    img: 'icons/kaka.png',
    fact: 'Intelligent parrot with a hooked beak, often seen in native forests.'
  },
  {
    name: 'Tūī',
    img: 'icons/tui.png',
    fact: 'Known for iridescent feathers and their mimicry-rich song.'
  },
  {
    name: 'Kererū',
    img: 'icons/kereru.png',
    fact: 'Large fruit-eating pigeon vital for forest regeneration.'
  },
  {
    name: 'Kākāpō',
    img: 'icons/kakapo.png',
    fact: 'Critically endangered flightless nocturnal parrot.'
  },
  {
    name: 'Tīeke',
    img: 'icons/tieke.png',
    fact: 'Rare songbird with a chestnut saddle and strong territorial calls.'
  }
];

let mobileBirdGrid = [];
const mobileBirdRows = 8;
const mobileBirdCols = 8;
const mobileBirdCount = 10;

function renderMobileBirdsweeper(container) {
  container.innerHTML = `
    <div class="game-intro">Tap tiles to reveal the forest. Find manu, avoid guesswork, and uncover native birds.</div>
    <div id="mobile-birdsweeper-grid"></div>
    <div class="mobile-game-button-row">
      <button class="mobile-game-button" onclick="initMobileBirdsweeper()">Reset Game</button>
    </div>
    <div class="mobile-bird-found" id="mobile-bird-found">
      <img id="mobile-bird-found-img" src="" alt="">
      <div id="mobile-bird-found-name" style="font-weight:bold; margin-bottom:6px;"></div>
      <div id="mobile-bird-found-fact"></div>
    </div>
  `;
  initMobileBirdsweeper();
}

function initMobileBirdsweeper() {
  const gridEl = document.getElementById('mobile-birdsweeper-grid');
  const foundEl = document.getElementById('mobile-bird-found');
  if (!gridEl) return;

  if (foundEl) foundEl.style.display = 'none';

  mobileBirdGrid = [];
  gridEl.innerHTML = '';

  while (mobileBirdGrid.length < mobileBirdRows * mobileBirdCols) {
    mobileBirdGrid.push({
      isBird: false,
      revealed: false,
      bird: null,
      element: null
    });
  }

  let birdsPlaced = 0;
  while (birdsPlaced < mobileBirdCount) {
    const i = Math.floor(Math.random() * mobileBirdGrid.length);
    if (!mobileBirdGrid[i].isBird) {
      const randomBird = mobileBirdFacts[Math.floor(Math.random() * mobileBirdFacts.length)];
      mobileBirdGrid[i].isBird = true;
      mobileBirdGrid[i].bird = randomBird;
      birdsPlaced++;
    }
  }

  mobileBirdGrid.forEach((cell, i) => {
    const cellDiv = document.createElement('div');
    cellDiv.className = 'mobile-bird-cell';
    cellDiv.dataset.index = i;
    cellDiv.addEventListener('click', () => revealMobileBirdCell(i));
    gridEl.appendChild(cellDiv);
    cell.element = cellDiv;
  });
}

function revealMobileBirdCell(index) {
  const cell = mobileBirdGrid[index];
  if (!cell || cell.revealed) return;

  cell.revealed = true;
  cell.element.classList.add('revealed');

  if (cell.isBird && cell.bird) {
    cell.element.classList.add('bird');
    cell.element.innerHTML = `<img src="${cell.bird.img}" alt="${cell.bird.name}" style="width:100%; height:100%; object-fit:contain; border-radius:6px;" />`;

    document.getElementById('mobile-bird-found-img').src = cell.bird.img;
    document.getElementById('mobile-bird-found-name').textContent = `Species: ${cell.bird.name}`;
    document.getElementById('mobile-bird-found-fact').textContent = cell.bird.fact;
    document.getElementById('mobile-bird-found').style.display = 'block';
    return;
  }

  const count = getAdjacentMobileBirds(index);
  if (count > 0) {
    cell.element.textContent = count;
  } else {
    getMobileBirdNeighbors(index).forEach(neighbor => revealMobileBirdCell(neighbor));
  }
}

function getAdjacentMobileBirds(index) {
  return getMobileBirdNeighbors(index).filter(i => mobileBirdGrid[i].isBird).length;
}

function getMobileBirdNeighbors(index) {
  const neighbors = [];
  const row = Math.floor(index / mobileBirdCols);
  const col = index % mobileBirdCols;

  for (let r = row - 1; r <= row + 1; r++) {
    for (let c = col - 1; c <= col + 1; c++) {
      if (r >= 0 && r < mobileBirdRows && c >= 0 && c < mobileBirdCols && !(r === row && c === col)) {
        neighbors.push(r * mobileBirdCols + c);
      }
    }
  }
  return neighbors;
}

/* =========================
   MOBILE PAINT
   a simplified touch-drawing canvas — pencil only, a small colour row,
   Clear. Not a clone of desktop's tool wheel/shapes/symmetry — those are
   built around a mouse-driven rotary dial that doesn't translate to a
   small touch screen, so this keeps just the part that does: drawing.
   ========================= */

let mobilePaintCtx = null;
let mobilePaintDrawing = false;
let mobilePaintColor = '#ff4fd8';
let mobilePaintLastPos = null;

const MOBILE_PAINT_COLORS = ['#ff4fd8', '#397ee5', '#58be47', '#ffcc33', '#184a8c', '#ffffff', '#1a1a1a'];

function renderMobilePaint(container) {
  container.innerHTML = `
    <div class="game-intro">Draw with your finger. Tap a colour to switch, Clear to start over.</div>
    <div class="mobile-paint-swatches" id="mobile-paint-swatches"></div>
    <canvas id="mobile-paint-canvas" class="mobile-paint-canvas"></canvas>
    <div class="mobile-game-button-row">
      <button class="mobile-game-button" onclick="clearMobilePaint()">Clear</button>
    </div>
  `;
  initMobilePaint();
}

function initMobilePaint() {
  const canvas = document.getElementById('mobile-paint-canvas');
  const swatchRow = document.getElementById('mobile-paint-swatches');
  if (!canvas || !swatchRow) return;

  // Reset drag state for the fresh canvas — otherwise a drag interrupted
  // while a previous Paint session's window was closing (or by a
  // pointercancel) could leave this true, drawing a stray line from a
  // stale mobilePaintLastPos the moment the new canvas sees a pointermove.
  mobilePaintDrawing = false;

  const cssWidth = canvas.getBoundingClientRect().width;
  const cssHeight = cssWidth * 0.75;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  canvas.style.height = `${cssHeight}px`;

  mobilePaintCtx = canvas.getContext('2d');
  mobilePaintCtx.scale(dpr, dpr);
  mobilePaintCtx.fillStyle = '#ffffff';
  mobilePaintCtx.fillRect(0, 0, cssWidth, cssHeight);
  mobilePaintCtx.lineCap = 'round';
  mobilePaintCtx.lineJoin = 'round';
  mobilePaintCtx.lineWidth = 6;

  swatchRow.innerHTML = '';
  MOBILE_PAINT_COLORS.forEach((color, i) => {
    const btn = document.createElement('button');
    btn.className = 'mobile-paint-swatch';
    if (i === 0) btn.classList.add('active');
    btn.style.background = color;
    btn.setAttribute('aria-label', `Colour ${color}`);
    btn.onclick = () => {
      mobilePaintColor = color;
      swatchRow.querySelectorAll('.mobile-paint-swatch').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
    };
    swatchRow.appendChild(btn);
  });

  canvas.addEventListener('pointerdown', startMobilePaint);
  canvas.addEventListener('pointermove', moveMobilePaint);
}

// One global listener, registered once — pointerup can land outside the
// canvas (finger drags off the edge), so this can't be scoped per-open
// the way the drawing listeners above are.
document.addEventListener('pointerup', () => { mobilePaintDrawing = false; });
// A drag can be interrupted without a pointerup (e.g. an iOS edge-swipe
// gesture takes over) — without this, mobilePaintDrawing gets stuck true.
document.addEventListener('pointercancel', () => { mobilePaintDrawing = false; });

function getMobilePaintPos(e) {
  const canvas = document.getElementById('mobile-paint-canvas');
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startMobilePaint(e) {
  e.preventDefault();
  mobilePaintDrawing = true;
  mobilePaintLastPos = getMobilePaintPos(e);
}

function moveMobilePaint(e) {
  if (!mobilePaintDrawing || !mobilePaintCtx) return;
  e.preventDefault();
  const pos = getMobilePaintPos(e);
  mobilePaintCtx.strokeStyle = mobilePaintColor;
  mobilePaintCtx.beginPath();
  mobilePaintCtx.moveTo(mobilePaintLastPos.x, mobilePaintLastPos.y);
  mobilePaintCtx.lineTo(pos.x, pos.y);
  mobilePaintCtx.stroke();
  mobilePaintLastPos = pos;
}

function clearMobilePaint() {
  const canvas = document.getElementById('mobile-paint-canvas');
  if (!canvas || !mobilePaintCtx) return;
  const rect = canvas.getBoundingClientRect();
  mobilePaintCtx.fillStyle = '#ffffff';
  mobilePaintCtx.fillRect(0, 0, rect.width, rect.height);
}

/* =========================
   MOBILE TUNA
   ========================= */

let mobileTunaInterval = null;
let mobileTunaDirection = 1;
let mobileTunaSnake = [];
let mobileTunaFood = null;
let mobileTunaScore = 0;
const mobileTunaGridSize = 14;
const mobileTunaTotalCells = mobileTunaGridSize * mobileTunaGridSize;

function renderMobileTuna(container) {
  container.innerHTML = `
    <div id="mobile-tuna-game">
      <div class="game-intro">Guide the tuna through the glowing tide. Use the arrows below and don't tangle yourself.</div>
      <div class="mobile-tuna-score" id="mobile-tuna-score">Score: 0</div>
      <div id="mobile-tuna-grid"></div>
      <div class="mobile-controls">
        <div class="empty"></div>
        <button onclick="setMobileTunaDirection('up')" aria-label="Up">↑</button>
        <div class="empty"></div>
        <button onclick="setMobileTunaDirection('left')" aria-label="Left">←</button>
        <button onclick="setMobileTunaDirection('down')" aria-label="Down">↓</button>
        <button onclick="setMobileTunaDirection('right')" aria-label="Right">→</button>
      </div>
      <div class="mobile-game-button-row">
        <button class="mobile-game-button" onclick="initMobileTunaGame()">Restart Tuna</button>
      </div>
    </div>
  `;
  initMobileTunaGame();
}

function initMobileTunaGame() {
  stopMobileTunaGame();

  const grid = document.getElementById('mobile-tuna-grid');
  const scoreEl = document.getElementById('mobile-tuna-score');
  if (!grid || !scoreEl) return;

  grid.innerHTML = '';
  for (let i = 0; i < mobileTunaTotalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'mobile-tuna-cell';
    grid.appendChild(cell);
  }

  mobileTunaSnake = [44, 45, 46];
  mobileTunaDirection = 1;
  mobileTunaScore = 0;
  scoreEl.textContent = 'Score: 0';

  spawnMobileTunaFood();
  drawMobileTuna();

  mobileTunaInterval = setInterval(moveMobileTuna, 220);
}

function getMobileTunaCells() {
  return Array.from(document.querySelectorAll('#mobile-tuna-grid .mobile-tuna-cell'));
}

function drawMobileTuna() {
  const cells = getMobileTunaCells();
  if (!cells.length) return;

  cells.forEach(cell => {
    cell.className = 'mobile-tuna-cell';
  });

  mobileTunaSnake.forEach((index, i) => {
    if (!cells[index]) return;
    cells[index].classList.add('mobile-tuna');
    if (i === mobileTunaSnake.length - 1) {
      cells[index].classList.add('mobile-tuna-head');
    }
  });

  if (cells[mobileTunaFood]) {
    cells[mobileTunaFood].classList.add('mobile-tuna-food');
  }
}

function spawnMobileTunaFood() {
  do {
    mobileTunaFood = Math.floor(Math.random() * mobileTunaTotalCells);
  } while (mobileTunaSnake.includes(mobileTunaFood));
}

function moveMobileTuna() {
  const head = mobileTunaSnake[mobileTunaSnake.length - 1];
  const next = head + mobileTunaDirection;

  const hitWall =
    next < 0 ||
    next >= mobileTunaTotalCells ||
    (mobileTunaDirection === 1 && head % mobileTunaGridSize === mobileTunaGridSize - 1) ||
    (mobileTunaDirection === -1 && head % mobileTunaGridSize === 0) ||
    mobileTunaSnake.includes(next);

  if (hitWall) {
    stopMobileTunaGame();
    const scoreEl = document.getElementById('mobile-tuna-score');
    if (scoreEl) scoreEl.textContent = `Game Over — Score: ${mobileTunaScore}`;
    return;
  }

  mobileTunaSnake.push(next);

  if (next === mobileTunaFood) {
    mobileTunaScore++;
    const scoreEl = document.getElementById('mobile-tuna-score');
    if (scoreEl) scoreEl.textContent = `Score: ${mobileTunaScore}`;
    spawnMobileTunaFood();
  } else {
    mobileTunaSnake.shift();
  }

  drawMobileTuna();
}

function setMobileTunaDirection(direction) {
  if (direction === 'up' && mobileTunaDirection !== mobileTunaGridSize) mobileTunaDirection = -mobileTunaGridSize;
  if (direction === 'down' && mobileTunaDirection !== -mobileTunaGridSize) mobileTunaDirection = mobileTunaGridSize;
  if (direction === 'left' && mobileTunaDirection !== 1) mobileTunaDirection = -1;
  if (direction === 'right' && mobileTunaDirection !== -1) mobileTunaDirection = 1;
}

function stopMobileTunaGame() {
  if (mobileTunaInterval) {
    clearInterval(mobileTunaInterval);
    mobileTunaInterval = null;
  }
}

/* =========================
   MOBILE GHOST
   gently drifts, avoids taps,
   desktop blink timing
   ========================= */

let mobileGhostStarted = false;
let mobileGhostEl = null;

let mgX = 40;
let mgY = 120;
let mgTargetX = 40;
let mgTargetY = 120;

let mgIdle = false;
let mgSleeping = false;
let mgIdleTimer = null;
let mgBlinkTimer = null;
let mgWhisperTimer = null;
let mgWanderTimer = null;
let mgDriftTimer = null;

const mgReducedMotion =
  window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const MOBILE_GHOST_SPRITES = {
  base: 'icons/ghost.png',
  blink: 'icons/ghost-blink.png',
  sleep: 'icons/ghost-sleep.png'
};

const mobileGhostWhispers = [
  "The forest remembers you.",
  "There is light between the moss.",
  "Softness is resistance.",
  "Time does not pass here.",
  "Stay. Drift.",
  "The rain was listening."
];


const originalEnterMobileSite = enterMobileSite;
enterMobileSite = function () {
  originalEnterMobileSite();
  initMobileGhost();
};

function initMobileGhost() {
  if (mobileGhostStarted) return;

  mobileGhostEl = document.getElementById('mobile-spirit-ghost');
  if (!mobileGhostEl) return;

  mobileGhostStarted = true;
  mobileGhostEl.style.display = 'block';
  mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;

  mgX = window.innerWidth * 0.25;
  mgY = window.innerHeight * 0.28;
  mgTargetX = mgX;
  mgTargetY = mgY;

  animateMobileGhost();
  blinkMobileGhost();
  resetMobileGhostIdleTimer();
  startMobileGhostWhispers();
  startMobileGhostDrift();

  // pointerdown covers both mouse and touch — the old code also
  // listened for touchstart, which made the ghost repel twice per tap
  document.addEventListener('pointerdown', repelGhostFromPoint, { passive: true });

  window.addEventListener('resize', () => {
    mgTargetX = clamp(mgTargetX, 8, window.innerWidth - 70);
    mgTargetY = clamp(mgTargetY, 8, window.innerHeight - 90);
    mgX = clamp(mgX, 8, window.innerWidth - 70);
    mgY = clamp(mgY, 8, window.innerHeight - 90);
  });
}

function animateMobileGhost() {
  mgX += (mgTargetX - mgX) * 0.035;
  mgY += (mgTargetY - mgY) * 0.035;

  if (mobileGhostEl) {
    mobileGhostEl.style.transform = `translate3d(${mgX}px, ${mgY}px, 0)`;
    leaveMobileGhostTrail();
  }

  requestAnimationFrame(animateMobileGhost);
}

function leaveMobileGhostTrail() {
  if (mgReducedMotion || Math.random() > 0.18) return;

  const trail = document.createElement('div');
  trail.className = 'mobile-ghost-trail';
  trail.style.left = `${mgX + 20}px`;
  trail.style.top = `${mgY + 20}px`;
  document.body.appendChild(trail);

  setTimeout(() => {
    trail.remove();
  }, 1200);
}


function blinkMobileGhost() {
  if (mgSleeping || !mobileGhostEl) return;

  mobileGhostEl.src = MOBILE_GHOST_SPRITES.blink;

  setTimeout(() => {
    if (!mgSleeping && mobileGhostEl) {
      mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;
    }
  }, 200);

  mgBlinkTimer = setTimeout(blinkMobileGhost, 400 + Math.random() * 500);
}


function startMobileGhostDrift() {
  clearTimeout(mgDriftTimer);

  function driftLoop() {
    if (!mobileGhostStarted || mgSleeping) return;

    const padding = 20;
    const maxX = Math.max(padding, window.innerWidth - 90);
    const maxY = Math.max(100, window.innerHeight - 130);

    const driftAmountX = 40 + Math.random() * 90;
    const driftAmountY = 30 + Math.random() * 70;
    const dirX = Math.random() > 0.5 ? 1 : -1;
    const dirY = Math.random() > 0.5 ? 1 : -1;

    mgTargetX = clamp(mgX + driftAmountX * dirX, padding, maxX);
    mgTargetY = clamp(mgY + driftAmountY * dirY, 30, maxY);

    mgDriftTimer = setTimeout(driftLoop, 2500 + Math.random() * 2500);
  }

  driftLoop();
}


function repelGhostFromPoint(e) {
  moveGhostAwayFromPoint(e.clientX, e.clientY);
}

function moveGhostAwayFromPoint(x, y) {
  if (!mobileGhostStarted) return;

  const ghostCenterX = mgX + 29;
  const ghostCenterY = mgY + 29;

  let dx = ghostCenterX - x;
  let dy = ghostCenterY - y;

  const dist = Math.sqrt(dx * dx + dy * dy) || 1;

  dx /= dist;
  dy /= dist;

  const repelDistance = 120;

  mgTargetX = clamp(mgX + dx * repelDistance, 8, window.innerWidth - 70);
  mgTargetY = clamp(mgY + dy * repelDistance, 8, window.innerHeight - 90);

  wakeMobileGhost();
  resetMobileGhostIdleTimer();

  if (Math.random() > 0.65) {
    showMobileGhostWhisper();
  }
}


function resetMobileGhostIdleTimer() {
  clearTimeout(mgIdleTimer);
  mgIdleTimer = setTimeout(triggerMobileGhostSleep, 40000);
}

function triggerMobileGhostSleep() {
  mgIdle = true;
  mgSleeping = true;

  if (mobileGhostEl) {
    mobileGhostEl.src = MOBILE_GHOST_SPRITES.sleep;
  }

  clearTimeout(mgDriftTimer);
  mobileGhostSleepWander();
}

function mobileGhostSleepWander() {
  if (!mgIdle || !mgSleeping) return;

  mgTargetX = Math.random() * Math.max(60, window.innerWidth - 90) + 10;
  mgTargetY = Math.random() * Math.max(120, window.innerHeight - 150) + 20;

  mgWanderTimer = setTimeout(mobileGhostSleepWander, 5000);
}

function wakeMobileGhost() {
  mgIdle = false;

  if (mgSleeping) {
    mgSleeping = false;
    clearTimeout(mgWanderTimer);

    if (mobileGhostEl) {
      mobileGhostEl.src = MOBILE_GHOST_SPRITES.base;
    }

    clearTimeout(mgBlinkTimer);
    blinkMobileGhost();
    startMobileGhostDrift();
  }
}

function showMobileGhostWhisper() {
  if (!mobileGhostEl) return;

  const whisper = document.createElement('div');
  whisper.className = 'mobile-ghost-whisper';
  whisper.textContent = mobileGhostWhispers[Math.floor(Math.random() * mobileGhostWhispers.length)];

  whisper.style.left = `${clamp(mgX + 20, 10, window.innerWidth - 190)}px`;
  whisper.style.top = `${clamp(mgY - 18, 10, window.innerHeight - 100)}px`;

  document.body.appendChild(whisper);

  setTimeout(() => {
    whisper.remove();
  }, 5500);
}

function startMobileGhostWhispers() {
  clearTimeout(mgWhisperTimer);

  function queueWhisper() {
    const delay = 30000 + Math.random() * 30000;
    mgWhisperTimer = setTimeout(() => {
      if (mobileGhostStarted && !mgSleeping) {
        showMobileGhostWhisper();
      }
      queueWhisper();
    }, delay);
  }

  queueWhisper();
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

</script>
